function highlight(node,term){if(!term)return;const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const n of nodes){const t=n.textContent,lower=t.toLocaleLowerCase(),q=term.toLocaleLowerCase();let pos=0,at=lower.indexOf(q);if(at<0)continue;const f=document.createDocumentFragment();while(at>=0){f.append(document.createTextNode(t.slice(pos,at)),el('mark','',t.slice(at,at+term.length)));pos=at+term.length;at=lower.indexOf(q,pos)}f.append(document.createTextNode(t.slice(pos)));n.replaceWith(f)}}
let searchFocus;
function goToMessage(dayIndex,rowIndex,query,dialog=$('#searchDialog'),partIndex){
 const chat=$('#chat');
 const row=$('#message-'+dayIndex+'-'+rowIndex);
 const target=partIndex===undefined?row:row?.querySelectorAll('.message-part')[partIndex];
 if(!target)return;
 if(searchFocus){
  searchFocus.classList.remove('focus-message');
  for(const mark of searchFocus.querySelectorAll('mark')){
   const parent=mark.parentNode;
   mark.replaceWith(document.createTextNode(mark.textContent));
   parent.normalize();
  }
 }
 searchFocus=target;
 target.classList.add('focus-message');
 target.querySelectorAll('.bubble').forEach(bubble=>highlight(bubble,query));
 dialog.addEventListener('close',()=>{
  requestAnimationFrame(()=>{
   const top=chat.scrollTop+target.getBoundingClientRect().top-chat.getBoundingClientRect().top;
   chat.scrollTo({top:Math.max(0,top-18),behavior:'instant'});
   target.focus({preventScroll:true});
  });
 },{once:true});
 target.tabIndex=-1;
 dialog.close();
}
function doSearch(){
 const query=$('#query').value.trim();
 const results=$('#searchResults');
 results.replaceChildren();
 if(!query){
  $('#resultCount').textContent='검색어를 입력하세요.';
  return;
 }
 const needle=query.toLocaleLowerCase();
 let count=0;
 groups.forEach(([date,rows],dayIndex)=>rows.forEach(([time,parts],rowIndex)=>{
  const text=parts.filter(part=>part[0]==='text'||part[0]==='reply').map(part=>
   part[0]==='reply'?personalize(part[1])+'\n'+personalize(part[2]):personalize(part[1])
  ).join('\n');
  if(!text.toLocaleLowerCase().includes(needle))return;
  const button=el('button','search-result');
  const caption=el('small','',date+' · '+formatTime(time));
  const body=el('span','',text);
  highlight(body,query);
  button.append(caption,body);
  button.onclick=()=>goToMessage(dayIndex,rowIndex,query);
  results.append(button);
  count++;
 }));
 $('#resultCount').textContent=count?`${count}개 결과`:'검색 결과가 없습니다.';
}

 노니까\n신선하고 재밌네유\n자주 놀러올게요 😁\n건강 조심하고 밥 챙겨묵고~\n2000일 축하해주셔서 감사합니다\n땡큐🥳","{이름}! Thanks for checking out POP~ This is fresh and fun. I'll drop by often 😁 Stay healthy and eat well~ Thanks for celebrating 2,000 days with me. Thank you 🥳"],["감기 조심하라능\n넘 춥다능","Don't catch a cold. It's sooo cold."],["모닝: 자네들 밥은 먹고 다니나 ?","Morning: Are you folks getting enough to eat?"],["배경화면 에어본 당한 최모닝이래 ㅋㅋㅋㅋ","They say the wallpaper is Choi Morning getting knocked airborne, hahaha."],["누가 우승할까유","Who's going to win?"],["우승자 : 늦잠 푹 잔 도란 ^_^","Winner: Doran, who got to sleep in ^_^"],["❄️눈 짱 많이 온다❄️\n❄️❄️❄️❄️❄️❄️\n❄️❄️❄️❄️❄️❄️\n❄️❄️❄️❄️❄️❄️","❄️ It's snowing so much! ❄️\n❄️❄️❄️❄️❄️❄️\n❄️❄️❄️❄️❄️❄️\n❄️❄️❄️❄️❄️❄️"],["창원은 눈이 귀해서 어릴땐 눈\n좋았는데\n지금은 별로야","We rarely get snow in Changwon, so I loved it as a kid. Not so much now."],["늙은건가? ㅜㅜ","Am I getting old? ㅜㅜ"],["내일은 일요일\n{이름} 늦잠을 허락한다모","Tomorrow's Sunday. {이름}, you have my permission to sleep in."],["늦잠이 늦게 자는게 아니야..\n원래 자던대로 자야지 😱","Sleeping in doesn't mean going to bed late… Go to bed at your usual time 😱"],["다시 보는데 옷이 다했다..","Looking at it again, the clothes did all the work…"],["머리 길어서 좀 자르고\n이제 밥 먹어야지 ^_^","My hair was getting long, so I got it trimmed. Time to eat ^_^"],["요즘 많이 안추워서 좋다\n하지만 미세먼지가 심하대\n가습기 키면 좀 좋을려나?","I like that it hasn't been too cold lately, but I hear the air pollution is bad. Would running a humidifier help?"],["강남 우렁각시 없나.. 가습기\n청소해야해","Is there a fairy godmother in Gangnam? I've got a humidifier to clean."],["오늘은 기필코 청소하고 잔다\n기도해줘!!","I'm definitely cleaning it before bed tonight. Pray for me!!"],["열심히 응원해준 덕분에\n세균박멸했다^^\n난 이제 잘건데 {이름} 은 자고\n있겠지? 존꿈꺼😴","Thanks to all your cheering, the germs have been eradicated ^^ I'm off to bed. You're probably asleep already, right, {이름}? Sweet dreams 😴"],["경기 재밌게 잘 끝냈다 ^^ 응원\n고마워유","The match was fun and went well ^^ Thanks for cheering!"],["요즘 꽂힌거 = 내 여자친구는 구미호\n어릴때 재밌게 봤는데 최근에 다시\n보니까 또 재밌음 ㅎㅎ","My latest obsession: My Girlfriend Is a Gumiho. I loved it as a kid, and it's still fun to watch now, haha."],["안봤으면 냅둬 나만볼거야","If you haven't seen it, leave it that way. It's just for me."],["막 도착해서 밥먹었다 ㅎㅎ\n존밤되구 주말 잘 보내 !!","Just got in and ate, haha. Have a good night and a great weekend!!"],["어제 본가 내려왔는데 잠이 쏟아져서\n푹 쉬었다 ㅎㅎ\n가족들이랑 밥 먹고 영화보려구!\n{이름} 연휴때 머해?","I went back to my family's place yesterday and was so sleepy that I got some proper rest, haha. I'm going to eat with my family and watch a movie! What are you up to over the holiday, {이름}?"],["오늘 서울역에서 택시 타려고 줄 서\n있었는데 내 앞에 한팀이 있었다?","I was in line for a taxi at Seoul Station today, and there was a group ahead of me, right?"],["택시가 왔는데 벤티? 그 큰 택시가\n온겨","Then a taxi showed up. A Venti? One of those big ones."],["그러니까 앞에 분들이 나보고 먼저\n타라고 하시는거야","And the people in front told me to take it first."],["그래서 비싼거 아닌가 하고\n망설이다가 타긴했는데.. {이름} 는\n어떻게 했을 것 같아?","I hesitated because I thought it'd be expensive, but I got in… What would you have done, {이름}?"],["1대3 한타는 못이기지.. 1대1\n라인전은 자신있지","I can't win a one-versus-three teamfight… I'm confident in a one-on-one lane, though."],["아무튼 근데 기사님이 너무\n친절하셔서 기분좋게 도착했다^^","Anyway, the driver was so nice that I got there in a great mood ^^"],["{이름}! 일주일 고생해따\n자고 일어나서 또 월요일\n시작해야지~","{이름}! Good work getting through the week. Time to sleep, wake up, and start another Monday~"],["아 어제 쇄골이 봤어?\n긁은게 아니라 마사지 한건데\n억울해따","Oh, did you see my collarbone yesterday? I was massaging it, not scratching it. I feel wrongfully accused."],["어뭐야 쇄골이가 아니라 쇄골 ..","Wait, what? I meant “collarbone,” not “Collarbone-y”…"],["[알림] 오늘 6일 11시30분 방송\n있습니다^_^","[Notice] I'm streaming today, the 6th, at 11:30 ^_^"],["일주일 반이 지났다😊 {이름} 화이팅!!","We're halfway through the week 😊 You got this, {이름}!!"],["나도 연습시작해유","I'm starting practice too."],["오늘도 응원 고마워 ^ㅇ^","Thanks for cheering again today ^ㅇ^"],["이제 밥먹고 들어왔다 배불러라","Just got back from eating. I'm so full."],["팀원 몇명이랑 중식당 다녀왔섭","I went to a Chinese restaurant with a few teammates."],["⬆️짜장면 잘 먹은사람⬆️","⬆️ Someone who enjoyed their jajangmyeon ⬆️"],["일찍 자고 내일 방송때 보자요 ㅎㅎ","Get to bed early. See you on stream tomorrow, haha."],["방송하러 가는중~~","On my way to stream~~"],["10분정도 늦을 것 같은건 비밀 ㅎㅎ","It's a secret that I might be about ten minutes late, haha."],["모닝이랑 휴가 열심히 보내는 중~~\n{이름} 주말 잘 보냈어?☺️","Taking my vacation very seriously with Morning~~ Did you have a good weekend, {이름}? ☺️"],["쉬면서 밀가루 너무 많이 먹었나..\n소화 이슈ㅜㅜ 다들 건강식단 하자구","Maybe I ate too much stuff made with flour while I was resting… Digestive issues ㅜㅜ Let's all eat healthy."],["이틀동안 먹은거 = 마라탕 피자 라면\n등등 ㅎㅎ^_^","What I ate in two days: malatang, pizza, ramyeon, and so on, haha ^_^"],["돈까스도 먹었었네 ㅋㅋㅋ\n아무튼 (내일부터) 열심히 산다!\n다들 주말 마무리 잘해 ㅎㅎ","Oh, I had pork cutlet too, hahaha. Anyway, I'm getting my act together (starting tomorrow)! Enjoy the rest of your weekend, haha."],["치킨에 밤샘했다... 난 틀렸어\n{이름} 너라도 ...\n난 이제 잘게 with 모닝☺️","I had fried chicken and stayed up all night… I'm a lost cause. Save yourself at least, {이름}… I'm going to bed now with Morning ☺️"],["서울에 있다가 창원오면 날씨가\n따뜻해서 좋당","Coming from Seoul to Changwon, it's nice how warm it is here."],["서울도 날씨 좀 풀렸니?","Has it warmed up in Seoul too?"],["{이름} ! 머하니?","{이름}! Whatcha doing?"],["내일부터 또 학교 가는구나 ㅎㅎ","You're back to school tomorrow, huh? Haha."],["근데 답장이 빠르다?","You replied pretty fast, though."],["쇼츠보고 있었나?","Were you watching Shorts?"],["쇼츠는 많이 보면 뇌에 안좋은\n영향을 줄 수 있대 😱 뭐든지\n적당히가 좋군","Apparently watching too many Shorts can be bad for your brain 😱 Everything in moderation, I guess."],["-쇼츠 보다가 팝 하는 사람-","—Someone who came to POP while watching Shorts—"],["와 이 말 하고 무의식적으로\n쇼츠보다 왔다.. 다들 조심하세요","Wow, right after saying that, I went back to Shorts without thinking… Be careful, everyone."],["몇달 전 가족사진 찍을 때 ㅎㅎ","From when we took family photos a few months ago, haha."],["후 근데 휴대폰 카메라가 좀 안좋네..\n핑계삼아 폰 좀 바꿀까 ㅋㅅㅋ","Phew, my phone camera isn't great though… Should I use that as an excuse to get a new phone? Hehe."],["근데 진짜 폰 카메라가 약간 누렇게\n나오는 것 같아 ㅜ","Seriously, my phone camera makes things look a bit yellow ㅜ"],["다른 최신 아이폰이랑 같은 사진\n찍어봤는데 내폰이 누렇게 나왔다능\n-.-","I took the same photo with a newer iPhone, and mine really did come out yellow -.-"],["설정 한번 바꿔보고 고민좀\n해보겠다능","I'll try changing the settings and think about it."],["소확행이라고 할 수 있겠다.","You could call that a small but certain happiness."],["편의점 아저씨가 숟가락 작은거 주심","The guy at the convenience store gave me a little spoon."],["{이름}! 날씨 많이 따뜻한데 나들이\n추천 ^_^","{이름}! It's gotten pretty warm. I recommend going out for a bit ^_^"],["프사는 셀카 찍으려다가 이커형한테\n걸렸더니 사진 찍어줌 ㅋㅋ","I was going to take a selfie for my profile, but Faker caught me and took the photo for me, haha."],["쉬는날이라 본가 내려왔는데\n차갑게 얼어가고 있을 투게더가\n생각난다.. 별로 못먹었음 ㅜ_ㅜ","I went home for my day off, and now I'm thinking about the Together ice cream getting colder and colder in the freezer… I barely had any ㅜ_ㅜ"],["맞아 조마쉬 님이 좋은 말 해주신거\n봤는데 감동했다 ㅎㅎ 동기부여 영상\n본 느낌\nThank you!","Oh yeah, I saw the kind things Joe Marsh said and was touched, haha. It felt like watching a motivational video. Thank you!"],["촬영중~~ 야외 촬영인데 좀 춥다 ㅎㅎ","On a shoot~~ It's outdoors and a bit cold, haha."],["요즘 촬영때문에 메이크업이 잦은데\n화장 받는것도 지우는것도 쉽지않다","I've been wearing makeup a lot for shoots lately. Neither getting it put on nor taking it off is easy."],["여자들은 매일하지? 대단하군...\nrepect","Women do this every day, right? That's impressive… repect."],["오타.. 모를리가 없자나 모른척해줘\n👀;;","A typo… Of course I know. Pretend you didn't see it 👀;;"],["자연스러워서 눈치 못챈 사람들 발견\nㅋㅋ","Spotted some people who didn't notice because it looked so natural, haha."],["퇴근!! 화장 지워야지 벅벅..","Off work!! Time to scrub this makeup off…"],["좀 쉬다가 11시 방송 있수다\n나중에 봅수다","I'm going to rest a bit. I've got a stream at 11. See you later."],["방송 일정 아직 안떴네\n사실 뻥이에요","The stream schedule isn't up yet. Actually, I made it up."],["오늘 방송 취소됐수다 ㅜㅜ\n감기 기운이 좀 있어서 ㅎㅎ 약먹고\n자면 나을 정도니까 걱정마슈","Today's stream got canceled ㅜㅜ I feel a cold coming on, haha. Some medicine and sleep should do it, so don't worry."],["자기 전 tmi)\n'폭삭 속았수다' 는 제주 방언이고\n해석하면 '수고 많으셨습니다' 라고\n한다!","Bedtime fun fact: “Pokssak sogatsuda” is Jeju dialect. It means “You worked really hard!”"],["어제 6화까지 봤는데 보다가\n처음으로 또륵 😢","I watched through episode six yesterday and shed my first tear while watching 😢"],["{이름}! 오늘도 폭삭 속았수당 ^^","{이름}! You worked hard today too ^^"],["아까 사진 찍었는데 좀 흔들림..","I took a picture earlier, but it came out a little blurry…"],["주말 잘 쉬었지 ? 내일부터 또\n열심히 일해봅시다 ^^","You got some good rest over the weekend, right? Let's get back to work tomorrow ^^"],["화이팅 ^^!","You got this ^^!"],["산불이 크게 나서 걱정이네 ㅜㅜ\n경상도도 심하다고하니 남일\n같지않구\n얼른 불길이 잡히면 좋겠다.","I'm worried about the big wildfires ㅜㅜ I hear it's bad in Gyeongsang too, so it hits close to home. I hope they get the fires under control soon."],["지방 사는 친구들 다들 몸조심해요\n😢","Everyone living in the affected regions, please stay safe 😢"],["이제 저녁 먹는다~~\n{이름} 은 맛난거 먹었나~?","I'm finally eating dinner~~ Did you have something good, {이름}?"],["-밥 맛있게 먹고 졸린 사람-","—Someone who's sleepy after a good meal—"],["요즘 최현준 대화 주제 = 폭싹\n속았수다\n만나는 사람마다 봤냐고 물어보는 중","Choi Hyeon-jun's conversation topic lately: When Life Gives You Tangerines. I ask everyone I meet if they've seen it."],["인생 드라마로 정해따.. 2화\n남겼는데 아껴 보고싶다가도 빨리\n보고싶고..","I've decided it's my favorite drama ever… I've got two episodes left. I want to save them, but I also want to watch them right away…"],["아직 안본 사람들은 나랑 인생을\n바꾸자!!\n나도 아직 안본 사람 하고싶어","If you haven't watched it yet, trade lives with me!! I want to be someone who hasn't watched it yet, too."],["사람마다 취향이 다르니까.. 추천은\n안할게 ㅋㅋㅋ 갑자기 자신 없어짐","Everyone has different tastes… so I won't recommend it after all, haha. Suddenly lost my nerve."],["내가 홍보팀도 아니고..\n홍보팀이었으면 1등 사원 했다","It's not like I'm on the marketing team… I'd be their top employee if I were."],["드라마는 드라마일뿐이지.. 현실로\n돌아가서 연습간다!","A drama's just a drama… Back to reality and off to practice!"],["Lck컵 끝난지 얼마 안된거같은데\n벌써 오늘 경기네 ㅎㅎ 준비 잘해서\n좋은 모습 보여줄게! {이름}도 응원\n많이 해줘😊","Feels like the LCK Cup only just ended, and we've already got a match today, haha. I'll be ready and show you a good performance! Cheer hard for us too, {이름} 😊"],["..??","…??"],["2달전 발언입니다\n최근 금재 아픈거랑 무관합니다..","I said that two months ago. It's unrelated to Geum-jae getting sick recently…"],["연습실 가는중~\n저녁 잘 챙겨먹고 11시 방송에서\n보자잉","On my way to the practice room~ Have a good dinner and see you on stream at 11."],["한판으로 대상혁 1000전 채운 사람","The guy who helped the great Faker hit 1,000 games with just one game."],["어 잠시만 한판이 아니고 저\n3판째네요\n나 오늘 개막한줄","Wait, that wasn't one game. It was my third. I thought the season started today."],["ㅋㅋㅋㅋ오늘 입장할때도 옆에\n선수분 같이 입장하는 줄도 모르고\n지나칠뻔..\n정신 차리고 살아야지 ㅠㅠ","Hahaha, when we walked in today, I nearly walked right past the player I was supposed to enter with. I really need to pay more attention ㅠㅠ"],["날씨 좋아서 한강 산책^^","The weather was nice, so I went for a walk by the Han River ^^"],["오늘은 아니고 저번준데.. 다시\n보니까 날씨가 좀 흐렸네","Not today, last week… Looking at it again, it was actually a little cloudy."],["저번주가 아니라 3일전쯤인가..","Wait, was it about three days ago, not last week…?"],["지금은 그냥 누워있는중 ㅎㅎ\n오늘 11시 방송 많관부라능","Right now I'm just lying down, haha. Tune in to the 11 o'clock stream if you can."],["연습 끝나고 운동가는중~","Finished practice and headed to work out~"],["걸어서 가면 40분 걸림 ㅜㅜ","It's a 40-minute walk ㅜㅜ"],["언제부터인가 등어깨 쪽이 불편해서\n재활운동 다님 ㅎㅎ 좋은 곳\n찾다보니까 좀 머네 그래도 효과\n조음 ㅎㅅㅎ","My upper back and shoulders have been bothering me for a while, so I've been doing rehab exercises, haha. I found a good place that's a bit far, but it works well, hehe."],["{이름}도 건강 조심!\n지금 {이름} 자세 안좋다\n다 보인다","Take care of yourself too, {이름}! Your posture is bad right now, {이름}. I can see it all."],["좀 늦었나..?","Am I a bit late…?"],["오랜만이야 {이름} 많이 바쁠까봐 ^0^","Long time no see, {이름}. I thought you might be really busy ^0^"],["나도 바쁘다 요즘.. 역시 시즌중에는\n여유가 없다 ㅎㅎ","I've been busy too… There's never much downtime during the season, haha."],["그래도 나름 재미있게 지내고 있징\n{이름}씨는 요즘 어때??","I'm still having a pretty fun time, though. How have you been, {이름}?"],["바쁘고 지칠땐 휴식이 필요한건\n아닌지\n되돌아보기~ 내일 경기 준비 잘할게\n고마워😉","If you're busy and worn out, take a moment to ask if you need a break~ I'll get ready for tomorrow's match. Thanks 😉"],["경기 잘 끝내고 숙소로 무사복귀 🤓","Finished the match and made it back to the team house safely 🤓"],["원정경기는 처음인 것 같은데 좋은\n경험했다 ㅎㅎ 수원까지 응원소리\n들려따 고마워","I think that was my first away game, and it was a good experience, haha. I could hear you cheering all the way in Suwon. Thank you."],["수원을 근데 처음 가본 것 같네..\n강남에서 은근 가까워서 놀랬다..!\n도시가 사람살기 좋아보였어 ㅋㅋ","I think that was my first time in Suwon… I was surprised it was so close to Gangnam! It looked like a nice city to live in, haha."],["7월달에 인천에서 홈경기 한다던데\n그것도 재밌겠다~~","I hear we're playing a home game in Incheon in July. That sounds fun too~~"],["이건 블루도란","This is Blue Doran."],["좀 늦었지만.. 나도 잘 몰랐는데 이번\n기회로 관심이 생겼어! ㅎㅎ","A bit late, but I didn't know much about it either, and this got me interested! Haha."],["늘 응원해줘서 고맙고~ 2라 시작이\n좋다!\n남은 경기도 잘 준비해볼게 화이팅\n💪💪","Thanks for always cheering. Round two is off to a good start! I'll prepare well for the rest of the matches. Let's go 💪💪"],["오이오이 주말 재밌게 잘 보냈냐능","Oi oi, did you have a fun weekend?"],["난 오랜만에 쉬는날이라 친구랑 같이\n바다 보고왔다능","It was my first day off in a while, so I went to see the sea with a friend."],["난 바다 보면서 멍때리기 좋아해 ㅎㅎ\n바다 냄새도 좋구","I like zoning out while looking at the sea, haha. I love the smell too."],["바다보고 칼국수 맛집가서 밥먹구\n빠른 복귀 ㅎ 하루 알찼다","Saw the sea, went to a great kalguksu place, ate, and headed right back, haha. A day well spent."],["젤 최근 방송때 컨디션 이슈로 일찍\n방종했자나\n근데 담날에 역대급 감기 왔었어 😭","Remember how I ended my last stream early because I wasn't feeling well? The next day I got the worst cold ever 😭"],["지금은 다 나았지만 ㅎㅎ\n낼 방송때 얘기해줄게~~","I'm all better now, haha. I'll tell you about it on stream tomorrow~~"],["수액 한번에 다 나은 감기긴해 ㅋㅋ","One IV drip was all it took to get over that cold, haha."],["{이름}도 아픈 곳 없게 끼니 잘\n챙겨먹자~ 컨조 신경써~","Eat well and stay healthy too, {이름}~ Take care of yourself~"],["약속 못지켰다.. 방송 키고 썰푼다는\n약속","I broke my promise… The one where I said I'd go live and tell you the story."],["아픈건 아니고 ㅜㅜ 오늘 lck컨텐츠\n촬영이 있었는데 낮에 시작해서 이제\n끝났음 😭","I'm not sick ㅜㅜ We were filming LCK content today. We started in the afternoon and only just wrapped up 😭"],["새벽방송은 가능할려나 싶었는데\n컨조 잘해서 내일 방송 재밌게\n하는게 맞는 것 같아서 과감히 휴식","I wondered if I could stream late at night, but I decided to take the night off so I'd feel good and have fun on tomorrow's stream."],["걱정해줘서 고마워 ~~\n응원에 보답하도록 푹 쉴게! 일단 좀\n씻구ㅋㅅㅋ","Thanks for worrying about me~~ I'll rest up to repay your support! First I'm going to wash up, hehe."],["애증의 가습기와","With my love-hate humidifier."],["오늘 점심은 마두밥 (마파두부밥)","Today's lunch is madu-bap (mapo tofu over rice)."],["마두밥 좋은데? 이렇게 부르는 사람 있나","Madu-bap sounds good, right? Does anyone else call it that?"],["내가 원조다 마두밥 쓸때 허락받으세요","I coined it. Ask permission before using madu-bap."],["{이름}씨는 무료로 써도 돼요","You can use it for free, {이름}."],["오늘자 유치원 가서 신난 모닝양","Miss Morning, thrilled to go to daycare today."],["낼름","Mlem."],["숙소 주변에 무인 아이스크림 가게 생겨서\n플렉스했다","A self-service ice cream shop opened near the team house, so I splurged."],["어 머야 제로 스크류바도 있네요","Oh, wait, there's a sugar-free Screw Bar too."],["머야 수박바도 제로네","What, the Watermelon Bar is sugar-free too."],["흠.. 맛이 많이 다른지 나중에 먹어보겠습니다","Hmm… I'll try them later and see how different they taste."],["지금은 밥먹어야해서","I need to eat a proper meal right now."],["절제중~","Practicing self-control~"],["티밥 육개장에 불고기?\n나오는거같던데","I think the T1 cafeteria has yukgaejang and bulgogi?"],["밥 먹고 방송킬게!\n{이름}도 잘준비하고 11시까지 참석바람.","I'll stream after eating! Get ready and report in by 11, {이름}."],["경기 이기고 팬미팅까지 ~\n재밌었다 ㅎㅎ","Won the match and had a fan meet too~ It was fun, haha."],["근데 벌써 정규 2경기 남은거 머지..\n시간 짱 빠르군","But how are there only two regular-season matches left already… Time flies."],["오늘도 응원 마니 해줘서 고마워 ㅎㅎ\n얼른 돌아가서 밥 먹고싶당 배고프다\n😭","Thanks for cheering so much again today, haha. I want to get back and eat already. I'm starving 😭"],["한끼식사를 대체할 캡슐알약 같은건 언제 나올까","When are we getting a little pill that can replace a whole meal?"],["오늘같은 날엔 그거먹고 자고싶다 ㅋㅅㅋ","On days like today, I'd take one and go straight to bed, hehe."],["{이름}!\n밥을 먹어야지 이상한 상상하지마렴","{이름}! Eat an actual meal. Don't get any weird ideas."],["출근이요~~","Off to work~~"],["나 곧 부산간다 부럽찌","I'm going to Busan soon. Jealous?"],["바다 보고싶긴한데 부산 숙소랑 좀 멀어서 볼 수 있을려나 ㅎㅎ","I'd like to see the sea, but it's a bit far from where we're staying in Busan. Think I'll get to see it? Haha."],["{이름}도 맛있는거 많이먹고\n기운내자~~ 응원한다능","Eat lots of good food and keep your spirits up too, {이름}~~ I'm rooting for you."],["오늘 어떤데~~","How about today~~"],["다같이 회식하러 왔다 ㅎㅎ 오늘은 소고기~","We're out for a team dinner, haha. Beef today~"],["응원 감사감사😆\n부산까지 들리던데?","Thanks, thanks for cheering 😆 I could hear you all the way in Busan."],["밥 잘먹고 바로 본가 갈 생각 ㅎㅎ\n휴가 짧지만 강렬하게 쉬어야지 ㅋㅋ","I'll eat well and head straight home, haha. It's a short vacation, but I'm going to rest hard."],["음료 머게?","Guess what I'm drinking."],["정답은 자몽허니블랙티","Answer: grapefruit honey black tea."],["맞춘 사람들은 카페 끊자 중독이야","If you got it right, it's time to quit cafés. You're addicted."],["저 사진은 얼마전이고 이제 일해야지\n오래쉬었다아이가","That photo's from a little while ago. Time to go back to work. I've rested long enough."],["회사 놀러온 강쥐","A doggy visiting the office."],["그리고 먹다가 찍은 중국냉면","And Chinese cold noodles, photographed halfway through eating."],["복수다","It's revenge."],["오너 팝 이상한거 올려요 가지마세요","Oner posts weird stuff on POP. Don't go there."],["팀원들이 미리 시차적응 한다고\n수면패턴을 바꿔서","My teammates shifted their sleep schedule in advance to get over jet lag."],["좀 따라해볼까 싶어서 자봤는데","So I tried sleeping to see if I could do the same."],["그냥 낮잠 잔 사람 됐음;; 잠이 안오네 ㅜㅜ","All I did was take a nap, though. Now I can't sleep ㅜㅜ"],["일어난김에 밥도 먹고 짐도 슬슬 챙겨야지 ㅋㅅㅋ","Since I'm up, I might as well eat and start packing, hehe."],["출국전에 좋아하는? 맛있는 음식들 최대한 다 먹는중.. 어제는 치킨 오늘은 짜장면","Trying to eat as much of my favorite tasty food as I can before I fly out… Fried chicken yesterday, jajangmyeon today."],["근데 경기시간이 한국시간으로 되게 아침 아닌가? 으뜨케 볼래","Won't the match be really early in the morning in Korea? How are you going to watch?"],["응원에 진심이군 ... ^_^ 열심히 준비해야겠는걸","You're really serious about cheering us on… ^_^ I'd better work hard to get ready."],["빠이빠이","Bye-bye."],["{이름}!\n우리나라를 부탁해 금방 올게~~","{이름}! Take care of Korea for me. I'll be back soon~~"],["한국은 새벽이니까 조용히 근황 남기고 간다.. 굿밤☺️","It's late in Korea, so I'll quietly leave a little update here… Good night ☺️"],["이른 시간에도 응원해줘서\n고맙다능~~\n이제 숙소 돌아와서 밥챙겨먹는다능","Thanks for cheering even at that early hour~~ I'm back at the hotel and getting something to eat."],["{이름}도 끼니는 거르면 안됩니다","No skipping meals for you either, {이름}."],["오늘 또 오랜만에 경기하니까 꽤 졸리다 ㅋㅋ 일찍 쉴게 오늘도 고마워","It's been a while since I played a match, and now I'm pretty sleepy, haha. I'll rest early. Thanks again today."],["캐나다에서 마지막 밤이당\n정신없이 경기에 집중하다보니 여기 자주 못들려서 미안함니당\n시차 때문에 경기 보기 힘들었을텐데도 불구하고 많은 응원과 관심 고마워 ☺️\n뭔가 되게 꿈같은 2주였다 ㅋㅋ 자고 일어나면 서울일 것 같은\n아쉬움은 오늘 밤 꿈에 묻어버리고\n내일부터 ewc 준비 열심히 해볼게~\n모두들 감사합니다","Last night in Canada. Sorry I didn't drop in much. I was busy focusing on the matches. Thanks for all your interest and support even though the time difference made it hard to watch ☺️ These two weeks felt like a dream, haha, like I'd wake up in Seoul. I'll leave the disappointment in tonight's dreams and start working hard for EWC tomorrow~ Thank you, everyone."],["끝났다~~ 집가자 집","It's over~~ Let's go home."],["낙곱새 먹고싶다.. 라면사리 뿌사서","I want nak-gop-sae with a brick of ramyeon crumbled into it…"],["마무리가 기대에 못미쳐 아쉽지만..\n그래도 길었던 1달 후련하다 ㅎㅎ\n{이름}도 고생많아따 응원 고마웠어\n☺️","I'm disappointed we didn't finish the way I'd hoped… Still, I'm relieved that long month is over, haha. You worked hard too, {이름}. Thanks for cheering ☺️"],["밥 먹어야지 이제 ㅎㅎ 배고프네잉","Time to eat now, haha. I'm hungry."],["생일이라 많은 축하 받았는데 어제 하루 대부분을 비행하느라 인사못해따..\n난 무사히 귀국했다 ㅎㅎ\n오늘은 늦었으니 생존신고만 하고 내일 올게!!\n{이름} 잘자 👋👋","I got lots of birthday wishes but was flying for most of yesterday, so I didn't get to say hi… I made it back to Korea safely, haha. It's late, so for now I'm just checking in. I'll be back tomorrow!! Good night, {이름} 👋👋"],["한국 왔는데 뭐부터 해야할지 몰라서 일단 잠만 자는중..","I'm back in Korea, but I don't know where to start, so all I've been doing is sleeping…"],["할거많은데 ..\n머리도 잘라야하고\n팬분들이 지하철 광고 해주신것도 봐야하는데..","There's a lot to do… I need a haircut and I want to see the subway ads fans put up…"],["광고 목격담만 들었는데 짱이라던데~~\n근데 어디어디있지..? 정보 바람","I've only heard from people who've seen the ads, and they say they're amazing~~ But where are they? Send tips."],["맞다 봤을지 모르겠지만 유기견 보호센터에 후원을 했어요~\n생각만 했지 실천한적은 없었는데 많은 사랑과 관심에 나도 어떻게 보답할 수 있을까 고민하다가 좋은 기회고 경험이라고 생각했어!","Oh, I don't know if you saw, but I donated to a shelter for abandoned dogs~ I'd thought about it before and never followed through. With all the love and attention I've received, I wondered how I could give back, and this seemed like a good opportunity and experience!"],["그리고 팬분들이 내 이름으로 기부했다고..\n당사자가 가만히 있을 수 없지~","And I heard fans donated in my name… I couldn't just sit back, could I~"],["이번 기회로 앞으로도 유기 동물에 대해 더 관심 가져 볼 생각!\n다 {이름} 덕분이야 고마워~~","I want to keep paying more attention to abandoned animals after this! It's all thanks to you, {이름}. Thank you~~"],["사우디에서 찍은 휴가 느낌나는.. ㅋㅋ","A photo from Saudi Arabia that looks like a vacation pic, haha."],["내가 모자는 되게 안어울리는데\n밀짚모자는 봐줄만해","Hats really don't suit me, but a straw hat is passable."],["글고 한국와서 먹고싶은게 많을줄 알았는데 캐나다랑 사우디에서 계속 한식 먹어서\n막상 한국 와도 먹고싶은게 없다..\n같이 가신 매니저님들이 너무 잘 챙겨주셨어 ㅋㅋ 한국처럼 지냈지롱","I thought there'd be a ton of food I'd miss in Korea, but we kept eating Korean food in Canada and Saudi Arabia, so now that I'm back there's nothing I'm craving… The managers who went with us took such good care of us. It felt like being in Korea, haha."],["난 슬슬 홈그 준비해야지! 안바쁜것보단 바쁜게 낫다\n다시 한번 기념일 축하해줘서 너무 고마워~\n항상 감사한 마음 가지면서 살게!\n쉬다가 일찍 자야지\n{이름}도 잘자😌","Time to get ready for Home Ground! Being busy beats having nothing to do. Thanks again for celebrating with me~ I'll always be grateful. I'm going to rest and sleep early. Sleep well too, {이름} 😌"],["홈그라운드 일정 재밌게 잘 마치고 숙소왔다! ㅎㅎ 같이 잼게 즐겨줘서 고마워~~","Had fun finishing the Home Ground schedule and made it back to the team house! Thanks for sharing the fun, haha~~"],["팬분들이 광고 여러군데 해주셔서 가까운곳 둘러보고 왔었음 ㅎㅎ","Fans put ads up in several places, so I went around to see the ones nearby, haha."],["사람들이 많이 다니는데 인증샷 찍기 민망해서 사진은 마니 못찍었어 ㅋㅅㅋ 눈으로 저장~~","Lots of people were passing by, so I felt awkward taking proof photos and didn't get many, hehe. Saved them with my eyes instead~~"],["신기한거 발견","I noticed something interesting."],["아까 셀카를 찍었는데\n안경알 때문인지 굴곡이 생겼는데 원래 안경쓴 사람들은 사진 저렇게 나오나?","I took a selfie earlier, and maybe it's the lenses in my glasses, but it warped the image. Do photos always look like that for people who wear glasses?"],["카메라가 이상한건가","Or is the camera weird?"],["어쩐지 셀카가 잘 안받더라..","No wonder I don't look good in selfies…"],["몇년전에 렌즈 도전했는데 넣었다 빼는데에 3시간정도 걸려서 그대로 폐기..","I tried contacts a few years back. It took me about three hours to put them in and take them out, so I gave up there and then…"],["@@@@렌즈 전담 도우미 구함\n@@@@\n시급은 모닝이 사진","@@@@ Hiring a dedicated contact lens assistant @@@@ Hourly pay: photos of Morning."],["ㅋㅋㅋㅋ 그냥 라식할게.. 물론 다음에 ㅎㅎ","Hahaha, I'll just get LASIK… Some other time, of course."],["얘 먹여살릴려면 열심히 해야지..\n난 내일 경기 준비할게!\n{이름}도 좋은 꿈 꾸고 내일보자☺️","I've got to work hard to feed this one… I'll get ready for tomorrow's match! Sweet dreams, {이름}, and see you tomorrow ☺️"],["오뱅있~ (오늘 방송 있다는 뜻)","Stream today~ (That's what the abbreviation means.)"],["궁금한거\n셀카 잘 찍는 팁 있나요? 각도라던가 기본설정 이라던가..","Something I'm curious about: any tips for taking good selfies? Angles, default settings, that kind of thing…"],["위에서 찍는다 확인","Confirmed: take it from above."],["근데 연예인들은 턱밑에서 찍어도 잘나오던디","But celebrities look good even from below the chin."],["연예인들은 기본카메라쓸까\n어플쓸까","Do celebrities use the default camera or an app?"],["나도 예전에 어플쓰다가 팬들한테 딱걸려가지고 기본카메라만 쓰는중 ㅋㅋ","I used an app once and the fans caught me right away, so I only use the default camera now, haha."],["이건 벤쿠버도란쓰","This is Vancouver Doran."],["투턱 일보직전인거같긴한데","I do look like I'm about one second from a double chin, though."],["ㅎㅎ 난 좀 쉬다가 연습끝나고 방송할 예정!\n좀바~(좀 이따가 봐요~)","Haha, I'm going to rest a bit, then stream after practice! See you in a bit~"],["퇴근합니다~~","Clocking out~~"],["경기 일찍 끝나서 좋다 ㅎㅎ 시간 여유가 있네!!","It's nice that the match ended early, haha. I've got time to spare!!"],["오너 덕분에 고전 좀 했다..\n밉다미워","Oner made things a bit rough for me… Bad Oner."],["앞에서 노래 부르고있네","He's singing right in front of me."],["최근에 1일 2면요리 먹었는데 자가피드백 해야겠다..\n저녁 뭐 먹을지 고민중 ㅎ","I've been eating two noodle meals a day lately. Time for some self-review… Trying to decide on dinner, haha."],["파스타 쌀국수 라면 볶음면 비빔면 여러가지 다 먹었어 ㅋㅋ","I've had pasta, pho, ramyeon, stir-fried noodles, bibim noodles, all kinds, haha."],["메밀..? 메밀 어릴땐 별로 안좋아했는데\n나이 드니까 맛있어\n이게 어른??","Buckwheat…? I didn't care for it as a kid, but it's good now that I'm older. Is this adulthood??"],["비도 오고 뜨뜻한 짬뽕 땡기네..","It's raining, and I want some hot jjamppong…"],["{이름}도 저녁 거르지말고 챙겨먹어\n^_^","Make sure you eat dinner too, {이름}. Don't skip it ^_^"],["자동차 의자 시점","Car seat POV."],["운동 다녀왔어요~~","I went to work out~~"],["See you soon..","See you soon.."],["날씨 넘 덥다!! {이름}도 집어컨 고고","It's so hot!! Go home and get the A/C on, {이름}."],["집+에어컨 내가 방금 만들었어","Home + air conditioner. I just invented that word."],["집어쳐는 따로 면담 좀 하자","Anyone who heard “get lost,” let's have a separate chat."],["오늘 방송 갑작스럽게 취소해서 미안..!\n이번주 마지막 방송이라 참고 하려했는데\n컨디션이 훅 떨어졌네 ㅜㅜ\n대신 컨조 열심히해서 경기 준비 잘해보께..!! 고마워~~","Sorry for canceling today's stream at the last minute..! It was my last one this week so I tried to push through, but I started feeling a lot worse ㅜㅜ I'll take care of myself and get ready for the match instead. Thank you~~"],["아 크게 안좋은건 아니니까 걱정말고!!","Oh, it's nothing serious, so don't worry!!"],["요즘처럼 더울땐 영화관 고고~~\n어제 혼자 영화보고 왔는데 밤이라 사람별로 없고 좋더라 ㅎㅎ","When it's hot like this, go to the movies~~ I went alone last night. It was late, so there weren't many people, which was nice, haha."],["악마가 이사왔다 봤는데 재밌어요\n👍👍","I watched Pretty Crazy. It was fun 👍👍"],["좀비딸도 봤었는데 난 개인적으로 악마가 더 재밌던데 ㅎㅎ","I watched My Daughter Is a Zombie too, but personally I liked Pretty Crazy more, haha."],["오랜만!! 난 본가 내려와서 가족들이랑 시간 보내고 있어~~","It's been a while!! I'm back home spending time with my family~~"],["다들 머하면서 지내징","What has everyone been up to?"],["오오 갓생 사는구나 잘해쓰","Oh, look at you living your best productive life. Good job."],["모닝이는 사회성 길러야해서 요즘 유치원 다니는데 지금쯤 하교해서 집오면 바로 뻗어잔다 ㅋㅋ","Morning's been going to doggy daycare to work on her social skills. She gets home around now and immediately passes out, haha."],["나도 곧 복귀해서 플레이오프 준비할 예정이야 ㅎㅎ 요즘 방송도 없고해서 심심할때도 있지만~~ 더 집중해서 경기준비 잘해볼게 ^_^","I'll head back soon and get ready for playoffs, haha. With no streams lately it can get boring, but I'll focus harder and get ready for the matches ^_^"],["요드추 (요즘 드라마 추천) 하나 하고갈게~\n폭군의 셰프 재밌더라 늦기전에 탑승해~~","A drama rec before I go~ Bon Appétit, Your Majesty is fun. Get on board before it's too late~~"],["요즘 날씨가 선선해서 기분이 좋아요","The cool weather lately has put me in a good mood."],["바이 빼고 사고싶었는데 옵션변경이 안된다","I wanted to buy it without Vi, but it won't let me change the options."],["티원 스킨 많관부~ (바이빼고)","Check out the T1 skins~ (except Vi)."],["미운놈 떡하나 더주자\n바이도 많관부~","Let's give the one we dislike an extra rice cake. Show Vi some love too~"],["플레이오프는 역시 바쁘다.. 근황 자주 못남겨줘서 미안😞","Playoffs really are busy… Sorry I haven't been updating you much 😞"],["경기 잘 마치고 휴가때 자주올게 ㅎㅎ\n내일도 응원해줘~~","I'll finish the matches strong and come by more often on vacation, haha. Cheer for me tomorrow too~~"],["모닝이도 응원한다~~","Morning is cheering too~~"],["주말 잘 보내고 있느냐~~","Are you having a good weekend~~?"],["난 제주 바다도 보고오고 본가 내려와서 열심히 쉬는중 ㅎㅎ\n이때다 싶어서 잘 쉬고있지요","I went to see the sea in Jeju, then came home and have been working hard at resting, haha. I'm making the most of it."],["멍치원 힘들당","Doggy daycare is hard."],["흠.. 얼굴 상태가","Hmm… that face."],["난 가족들이랑 외식하러 밖에 나왔어 ㅎㅎ\n휴가 잘 쉬고 연습 열심히 해야지~!\n이제 연습경기 끝나따잉 10월이 진짜지\n인정 동의??","I'm out eating with my family, haha. I'll rest well on vacation and then practice hard~! Scrims are over. October is when it really counts. Agree?"],["조아조아 {이름}도 건강하게 잘 지내고 월즈까지 힘 아끼자 ㅎㅎ\n저녁 잘 챙겨먹고 뭐 먹었는지 남겨놓고 ^_^","Good, good. Stay healthy too, {이름}, and let's save our energy for Worlds, haha. Eat dinner and leave me a note about what you had ^_^"],["머리가 길지요\n출국전에 미용실 가야징","My hair is long, yeah. I'll go to the salon before flying out."],["방금 폭군의 셰프 마지막화 봤는데\n슬펐다 ㅜㅜ 여운이 남는 ㅠㅠ","I just watched the last episode of Bon Appétit, Your Majesty. It was sad ㅜㅜ It'll stick with me."],["출국전 퀘스트 완료 1/10","Pre-flight quest complete: 1/10."],["머리짤라따","Got a haircut."],["중국 찹따.. 비가오네","It's chilly in China… It's raining."],["만리장성도 가보고 출세했다잉","I even got to see the Great Wall. I've come up in the world."],["시차 거의 없어서 경기 보기\n편하려나 ㅎㅎ\n준비 잘해서 8강 가보겠다 오바","The time difference is tiny, so it should be easy to watch, right? Haha. I'll prepare well and try to make quarters. Over."],["8강 가보겠다고 한게 마지막인데\n어느덧 결승진출 ㅎㅎ 믿고\n응원해줘서 고맙다람쥐^_^","My last update was about trying to make quarters, and now here we are in the finals, haha. Thanks for believing in me and cheering me on, my squirrels ^_^"],["모닝이도 {이름}도 건강하고 맛있는거\n마니 챙겨먹어!! 종종 소식 전해줄게\n☺️","Stay healthy and eat lots of good food, both Morning and {이름}!! I'll check in now and then ☺️"],["으아아아아아아","Aaaaaaaaaah!"],["짠","Ta-da!"],["숙소왔다 ㅎㅎ 한달만에 제대로\n쉬어보겠네 좋다아","I'm back at the hotel, haha. I'll finally get to rest properly for the first time in a month. Nice."],["인스스 투표결과 궁금한사람~~","Anyone curious about the Instagram Story poll results~~?"],["아 뭐야 투표하면 결과 보여?","Oh, wait, can you see the results after voting?"],["뭐야","What the heck."],["암.베사","Am. Bessa."],["하.. 왜 금지어지","Ugh… Why is that a banned word?"],["팝 전용 호칭 지어주자","Let's give her a POP-only nickname."],["베찌 로 불러야징","I'll call her Bejji."],["베찌가 인기투표 1위했습니다 박수\n👏👏","Bejji won the popularity poll. Applause 👏👏"],["하지만 확정된건 아니니까 천천히\n고민 잘 해볼게 ㅎㅎ","It's not final, though, so I'll take my time and think it through, haha."],["투표한 사람들 성향 추측해봤어\n베찌 - 올드티원팬\n카밀 - 그냥 탑라이너들\n그라가스 - 도란 좀 오래\n좋아한사람들","I tried guessing who voted for what: Bejji — longtime T1 fans. Camille — just top laners. Gragas — people who've liked Doran for a while."],["어때 맞지?","What do you think? Am I right?"],["한국와서 할게많다 ㅎㅎ 머리도 좀\n잘라야하고~ 근데 어제오늘 거의\n못자서 일단 좀 쉴 생각~!","Lots to do back in Korea, haha. I need a haircut and all that, but I barely slept yesterday or today, so I'm going to rest first~!"],["맞다.. 비빔면 5개 푸파","Oh, right… The five-pack bibim noodle eating challenge."],["라면이었나? 아무튼 어떻게하냐근데","Was it ramyeon? Either way, how am I supposed to do that?"],["일단 좀 쉬고 휴가기간동안 근황공유\n할게~\n{이름}도 고생많았다!! 고마워☺️","I'll rest for now and share updates over vacation~ You worked hard too, {이름}!! Thanks ☺️"],["감기걸렸다 ㅜㅜ 창원집에서\n회복중이야\n{이름}도 조심..","I caught a cold ㅜㅜ I'm recovering at home in Changwon. Be careful too, {이름}…"],["창원 오기전에 피부과 갔었는데 꽃\n준비해주셨다 ㅎㅎ 근데 그 멘트 또\n등장 🥺","I went to the dermatologist before coming to Changwon, and they had flowers ready for me, haha. But that line showed up again 🥺"],["도란이라는 드라마 금지\n그 드라마 시청률 0.3퍼로\n망했답니다","No more of that drama called Doran. It flopped with a 0.3% rating."],["ㅋㅋㅋㅋ 부끄러워서 그런거지 ㅎㅎ\n아무튼 휴가 평화로우니 조으네~","Hahaha, I'm just embarrassed. Anyway, it's nice having a peaceful vacation~"],["날씨 좋습니다~","Lovely weather~"],["(아 오늘 사진은 아님)","(Oh, the photo isn't from today.)"],["{이름} 응원 덕분에 스토브리그\n깔끔하게 마무리했다~\n내년에도 함께 행복하게 즐겨보자구","Thanks to your support, {이름}, the offseason wrapped up nicely~ Let's have another happy year together."],["흠 팝이랑 인스타 프사\n바꿔야하는데..\n이거 배경사진 바꾸는 법을\n모르겠다능","Hmm, I need to change my POP and Instagram profile pics… I don't know how to change the wallpaper on this thing."],["근데.. 찍은 셀카나 사진들이 다 여기\n올렸던것들이라","But all the selfies and photos I've taken are ones I already posted here."],["지금부터 사진 마니 찍고 새사진을\n프사로 할게!!","I'll take lots of pictures from now on and use a new one as my profile pic!!"],["인스타는 프로필 트로피사진으로\n해야징\n“고화질”로","For Instagram I'll use the trophy picture. In “high resolution.”"],["근데 고화질 어디서 받아?","But where do I get it in high resolution?"],["팬라에몽 좋구만","Fan Doraemon comes through."],["좋은사진 찾아서 바꿀게 ~^^","I'll find a good picture and change it ~^^"],["모닝이 무릎위에 눕는거 조아함 ㅋ_ㅋ","Morning likes lying on my lap ㅋ_ㅋ"],["무릉도원이세요","Are you in paradise?"],["나온김에 혼밥","Eating alone since I'm already out."],["저녁밥을 위해서 감자튀김은 과감히\n포기.","For the sake of dinner, I'm boldly giving up fries."],["결단할땐 확실히 얘들아","When you make a decision, commit, kids."],["맞다 푸파 음식 종목은 비빔면으로\n결정났습니다 땅땅땅","Oh, right. Bibim noodles are officially the food for the eating challenge. Case closed."],["라면은 목 데일수도.. 안전제일","Ramyeon could burn my throat… Safety first."],["+ 내가 비빔면 좀 조아함","Plus, I kind of love bibim noodles."],["비빔면 한봉지는 보통 한입에 다\n먹으니까\n다섯입이면 푸파끝","I usually finish one pack in one bite, so five bites and the challenge is over."],["란바","Doran out."],["레드불 경기 간다능","Off to the Red Bull matches."],["염색 안했는디?","I didn't dye my hair, though?"],["근데 좀전에 염색 얘기는 했어\n애들이랑\n태극기 색깔로 하자고\n빨간색파란색흰색","We did talk about dying it earlier. We said we should do the colors of the Korean flag: red, blue, and white."],["월즈 10핏하면 혼자서도 태극기염색\n가능\n🇰🇷🇰🇷🇰🇷","If I win Worlds ten times in a row, I'll dye it like the Korean flag all by myself 🇰🇷🇰🇷🇰🇷"],["와근데 태극기 염색한사람 있나?\n최초로 기네스북 가볼까","Whoa, has anyone actually dyed their hair like the Korean flag? Should I be the first and get into Guinness?"],["일단 그럼 라면 푸파부터 할게..\n독일가서 위 좀 확장시키고\n와야겠다~\n{이름}도 좋은 하루 보내 ㅎㅅㅎ","I'll start with the noodle challenge, then… I'd better go to Germany and stretch my stomach~ Have a good day too, {이름}, hehe."],["한국시간 내일 새벽2시 티원\n경기~~\n많관부 :)","T1 plays tomorrow at 2 a.m. Korea time~~ Tune in if you can :)"],["레드불 끝~ 재밌는 경험 했다요","Red Bull is over~ That was a fun experience."],["미미미누 님이랑 이번에 컨텐츠 같이\n했는데\n너무 재밌으심.. 대단한 분이심....","I filmed something with Mimiminu this time. He's so funny… Really impressive."],["나도 방송인으로써의 재능을\n갖고싶다..\n이건 재능일까 노력일까\n아마도 재능이겠지\n잔인한 세상","I wish I had that talent as a streamer… Is it talent or hard work? Probably talent. Cruel world."],["ㅋㅋㅋㅋ근데 미미미누 님 유튜브\n보면 게스트들이 보통\n연예인분들이라 텐션이 어느정도\n맞는데 이번엔 샤이한\n프로게이머들이랑 하셔서 좀\n힘드셨을 것 같애 ㅋㅅㅋ","Hahaha, on Mimiminu's YouTube his guests are usually celebrities, so they can match his energy. This time he got shy pro gamers, so I think it must've been tough for him, hehe."],["샤이도란은 이제 잘준비 완료~~\n경기 시간 늦었는데 챙겨봐줘서\n감사합니다\n오늘도 좋은 하루 보내자 화이팅💪\n💪","Shy Doran is ready for bed~~ Thanks for watching even though the match was late. Have a great day today too. You got this 💪💪"],["독도(독일도란)끝~~","Germany Doran signing off~~"],["사우디 날씨 조타잉","The weather in Saudi Arabia is nice."],["뒤에 누구게요\n맞추면 티잘알","Guess who's behind me. Get it right and you really know T1."],["문도입니다\n대부분 잘 맞추네 ㅎㅎ","It's Mundo. Most of you got it, haha."],["The Red Sea 와 함께하는 사우디\n투어\n몸에 쌓인 피로가 싹 가시네 ~~","Touring Saudi Arabia with the Red Sea. All the fatigue is washing away~~"],["구운도란으로 새롭게 태어날 예정..\n햇빛이 강해요","About to be reborn as Toasted Doran… The sun is strong."],["수생(수환생일) 기념","In honor of Su-hwan's birthday."],["한국입니다.. 한국 너무 좋다..\n무엇보다 데이터 와이파이 잘되는게\n쵝오👍","I'm in Korea… I love Korea… Best of all, mobile data and Wi-Fi actually work well 👍"],["집 들어와서 50분째 땅바닥에서\n빈둥대는거 정상??","Is it normal to come home and spend 50 minutes lying around on the floor?"],["아까우니까 한시간 채워야지","Might as well make it a full hour."],["슈퍼E가 되고싶다..\n해외 다녀와서도 밖에서 놀 수 있는\n용기를 가진 그런 E","I wish I were a super extrovert… The kind who has the energy to go out even after an overseas trip."],["난 안되지","I couldn't do it."],["난 지금 이순신 장군님이 우리집와도\n문 못열어줘","Right now I wouldn't even open my door if Admiral Yi Sun-sin came over."],["열어드릴게요..","Okay, I'd open it for you, sir…"],["한시간 채웠다잉\n진짜 씻으러감!! 오늘도 조은하루\n보내자잉","Made it to an hour. I'm actually going to wash up now!! Let's have a good day."],["머쓱.. 졌는데 이겼다","Awkward… We lost, but won."],["승리와 패배를 동시에 쟁취했습니다","I claimed victory and defeat at the same time."],["플랫폼이 평소 경기랑 달라서 보기\n힘들었을텐데 관심 가져줘서\n고마워~~\n남은 경기들 잘 마무리해볼게 ☺️","It might've been hard to watch on a different platform than usual, so thanks for tuning in~~ I'll do my best to finish the remaining matches well ☺️"],["며칠 전 형 결혼식때 ㅎㅎ\n형아랑 학교다닐때가 엊그제같은데\n세월 흐른게 체감됐다.. ㅎㅎ","From my older brother's wedding a few days ago, haha. It feels like yesterday that we were in school together. It made me realize how much time has passed."],["뭐야 형아 라고들 안하나?\n사투리여?","Wait, do people not say “hyeong-a”? Is it dialect?"],["휴 떠들다보니 집도착!!\n어린이들은 12시 전에 자야해\n얼른 폰 그만하고 자라잉","Phew, I talked all the way home!! Kids have to sleep before midnight. Put your phone down and go to bed."],["굿밤굿밤~~☺️☺️","Good night, good night~~ ☺️☺️"],["이번 주 팬미팅 연달아 짜라락\n했는데 재밌었다 ㅎㅎ 와서 좋은\n추억 같이 보내준 친구들 고마워","We had a whole string of fan meets this week, and they were fun, haha. Thanks to everyone who came and made good memories with me."],["저번 촬영때 ㅎㅅㅎ","From that shoot a while ago, hehe."],["근데 휴대폰이 박살이 났넹","But my phone got smashed."],["ㅋㅋㅋㅋ 관찰력 머야 ??!!","Hahaha, how did you notice that??!!"],["밑에 좀 많이 깨져서.. 수리\n맡겨야하는데..\n미루는중","The bottom's pretty badly cracked… I need to take it in for repairs… I've been putting it off."],["한 2주 됐는데 어제였나\n휴대폰 부서진채로 쓰면 손에 미세\n금속? 박힌다는 소리 듣고 좀\n무서워짐 ㅠㅠ\n{이름}도 수리점 얼른 가세요","It's been about two weeks, but yesterday or so I heard that using a broken phone can leave tiny bits of metal in your hand? It scared me ㅠㅠ Get yours repaired soon too, {이름}."],["케이스는 손목 건강을 위해 뺐어\n무게 차이가 좀 느껴지더라고\n근데 수리하면 다시 껴야지 ㅇ.ㅇ","I took the case off for my wrist. I could feel the weight difference. I'll put it back on once it's repaired, though ㅇ.ㅇ"],["암튼 항상 저의 행복을 빌어주는\n팬분들 감사합니다.\n덕분에 올 한해도 따뜻하게 마무리\n할 수 있을 것 같네요.\n저 또한 여러분들에게 힘이 되고\n위로가 되는 존재가 되도록 내년에\n더 열심히 살아보겠습니다!\n연말 마무리 잘 하시고 오늘도 좋은\n밤 보내셔요🥰🥰🥰","Anyway, thank you to the fans who always wish for my happiness. Thanks to you, I think I'll get to end this year on a warm note. Next year I'll work even harder to be someone who brings you strength and comfort too. Enjoy the end of the year and have a lovely night tonight 🥰🥰🥰"],["상 나이 또이 안 퍼","I had pho this morning."],["베트남 팬분들과 좋은 시간 보내고\n돌아갑니다 ㅎㅎ","I had a great time with the Vietnamese fans, and now I'm heading back, haha."],["행사 중간에 한장 찰칵","A quick snap in the middle of the event."],["한국 돌아가서 개인 방송 해야지 ^_^\n레드불 사우디 케스파컵 베트남 얘기\n밀렸당","I should do a personal stream when I get back to Korea ^_^ I've got a backlog of stories from Red Bull, Saudi Arabia, the KeSPA Cup, and Vietnam."],["푸파 종목 정했어\n목표는 2분컷.","I picked what to eat for the challenge. Goal: under two minutes."],["한국가서 보자!!\n\nCảm ơn Việt Nam, hẹn gặp lại","See you back in Korea!! Thank you, Vietnam. See you again."],["우승했습니다 ^_^","We won ^_^"],["소녀시대 OH 뮤비 롯데월드\n링크장에서 한거 알지\n막 뮤비보면 시민들도 2층3층에서\n구경하고 ㅋㅋㅋ","You know Girls' Generation filmed their “Oh!” music video at the Lotte World ice rink, right? You can see people watching from the second and third floors in the video, haha."],["보면서 그 감성 너무 좋았는데\n거기서 경기하니까 재밌더라 ㅎㅎ","I loved that vibe when I watched the video, so it was fun to play there, haha."],["저메추 저메추","Dinner recs, dinner recs."],["저녁밥을 못정하는 병에 걸렸다","I've come down with can't-decide-on-dinner disease."],["두쫀쿠 먹어봤지~","I've tried Dubai chewy cookies~"],["맛있긴한데 .. 초코 가루가 너무 씀\nㅠ","They're good… but the cocoa powder is too bitter ㅠ"],["요즘 흑백요리사 봐서 그런가 음식\n먹을때마다 도성재 빙의","Maybe because I've been watching Culinary Class Wars, but I turn into Doran-as-Sung Anh every time I eat."],["쓸데없이 까다로워지는중","Getting pointlessly picky."],["돌고돌아 치킨 ㅎㅎ {이름}도 저녁 잘\n챙겨먹기~~","It always comes back to fried chicken, haha. Make sure you eat dinner too, {이름}~~"],["고생했다멍~~","Good work, woof~~"],["미드라이너 도란입니다 안녕하세요.","Hello, I'm Doran, mid laner."],["도이커 대기중.. 우승해야지 가보자\nㅎㅎㅎㅎ","Doran-Faker on standby… Gotta win. Let's go, hahaha."],["영화 아바타에 “토루크 막토” 라는\n칭호가 있는데 민족의 영웅을 뜻해","In Avatar there's a title, “Toruk Makto.” It means a hero of the people."],["탑팀의 토루크 막토가 되어올게..","I'll go become the top team's Toruk Makto…"],["미드 공기가 탁하네...","The air in mid lane is stuffy…"],["전적에 오리아나 남겨서 뺏겼나..\n저의 안일함을 반성합니다","Did they take Orianna because I'd left her in my match history? I regret being so careless."],["뉴니폼 ㅎㅎ","New jersey, haha."],["하이하이","Hi hi."],["오늘 날씨 넘 좋다!! 마음도\n따뜻해지는 날씨","The weather is so nice today!! It warms your heart too."],["두쫀쿠 애들이랑 사러갔다왔는데\n인기있을만하네 ㅇ.ㅇ 마싯어요","I went to get Dubai chewy cookies with the guys. I can see why they're popular ㅇ.ㅇ They're tasty."],["가족들이랑 밥 먹으면서 쉬는중 ㅎㅎ\n창원 가진않고요","Resting and eating with my family, haha. I didn't go to Changwon, though."],["새벽에 미안.. 노래 한곡 부르고 자러간다잉 ☺️☺️\n원래 1분짜리 영상인데 용량이 커서 길게 못올리네 ㅎㅎ\n잘 자고 오늘도 화이팅💪💪","Sorry it's so late… I'm off to bed after singing one song ☺️☺️ The original video is a minute long, but it's too big to post the whole thing, haha. Sleep well and good luck today too 💪💪"],["우왕 감사합니다 😭","Wow, thank you 😭"],["언박싱 해봤는데ㅋㅋㅋㅋ\n선물들 가격대가 좀 있어뵈는디..후달달","I unboxed them, hahaha. These gifts look kind of expensive… Yikes."],["그러지마쇼요 ㅠ","Please don't go that far ㅠ"],["하하하하 얼마전에 바다가서 힐링 ㅎㅎ","Hahaha, I went to the sea a little while ago to unwind."],["불금 어떻게 보내시는지..? 우린 열심히 경기준비 하고있다!!","How are you spending Friday night…? We're working hard preparing for our match!!"],["좋다 다들 좋은밤 보내고 있군\n주말 푹 쉬면서 티원 경기 응원 부탁해 ㅎㅎ\n잘해보께잉","Nice, sounds like you're all having a good night. Rest up over the weekend and cheer for T1, haha. I'll do my best."],["방금 가족들이랑 왕과 사는 남자 보고왔는데\n대박.. 다들 봤으려나","I just saw The Man Who Lives with the King with my family. Wow… Have you all seen it?"],["넘 슬픔 ... ㅜㅜ","So sad… ㅜㅜ"],["생각해보니 이런 영화는 스포가 없겠군\n역사적 사실 기반이니..\n연기를 너무 잘하셔 ㅋㅋㅋㅋ","Come to think of it, I guess you can't spoil a movie like this since it's based on real history. The acting is so good, haha."],["굿모닝 👋👋\n오늘 좀 쉰다 ㅎㅎ","Good morning 👋👋 I'm getting some rest today, haha."],["혼자 재밌게 놀고 활동적인 머 없나?\n추천추천","Anything fun and active to do by yourself? Recs, please."],["저번에 진짜 특별한 상황이 와서 혼자 만화카페 갔는데","I ended up going to a comic café by myself the other day under some very unusual circumstances."],["너무 좋더라.. 밥주지 누울수있지 아늑하지","It was so good… They feed you, you can lie down, and it's cozy."],["밥먹고 가서 라면 하나밖에 못먹었었는데\n담에 계획세우고 가볼 의향 있어 ㅎㅎ","I'd eaten before going so I only had one bowl of ramyeon. I'd plan ahead and go again, haha."],["아 근데 중요한 만화는 딱히 재밌는거 없더라.. 아이패드 같은거 들고 드라마 보는데 나을듯 ㅋㅅㅋ","Oh, but the important part, the comics, didn't really grab me… I might be better off taking an iPad and watching a drama, hehe."],["동물원 가기 좋다","Going to the zoo sounds nice."],["제주도 갔을때 동물원 갔는데 공작맞나? 암튼 얘 봤음","I went to a zoo in Jeju. Is this a peacock? Anyway, I saw this one."],["아까 날씨 좋아서 한강 다녀왔어 ㅎㅎ\n산책하니 좋더라~ {이름}도 여유 있을때 틈틈이 건강관리 하자구 😁\n안자는 사람은 얼른 자고\n자는 사람은 오늘도 좋은 하루 보내 🤓🤓\n난 이제 잔다!! 굿밤굿밤","The weather was nice earlier, so I went to the Han River, haha. A walk felt good~ Take care of yourself when you get a bit of time too, {이름} 😁 If you're still awake, go to sleep. If you're already asleep, have a great day when you wake up 🤓🤓 I'm going to sleep now!! Night night."],["불금인데 머하숑","What's everyone doing on Friday night?"],["잘 쉬고있군 흠흠","I see you're getting some good rest, hmm hmm."],["버터떡 후기 들려주러 왔다네","I came to give you my butter rice cake review."],["에이전시에서 구해주셔서 먹어봤는데\n혼자 다섯개는 먹음.. 넘 마싯던데 ㄷㄷ","My agency got some for me. I ate at least five by myself… They were so good, wow."],["그시절 탕후루급","Like tanghulu back in its heyday."],["난 되게 마싯었어","I thought they were really good."],["근데 어감이 좀 부자연스럽다해야하나..\n먼가 버터떡! 먼가먼가..","But the name sounds a little awkward, I guess? “Butter rice cake!” Something about it…"],["암튼 추천이요 ^^","Anyway, I recommend it ^^"],["뉴 도팝란팝","New Doran POP."],["오랜만에 배경사진 좀 바꿨당","I changed the wallpaper for the first time in a while."],["근데 모닝이 초상권 막 쓰면 모닝이도 기분나빠하려나 ㅠ\n미안하네 갑자기","Would Morning get upset if I keep using her likeness without asking? ㅠ Suddenly I feel bad."],["됐다 ㅎㅎ 저녁 먹었니","Done, haha. Have you had dinner?"],["난 찜닭 1인분 솔킬땀","I solo-killed a single serving of jjimdak."],["솔킬은 아니고 플은뺀듯.. 조금 남았는데 고기는 다먹었어 ㅋㅅㅋ","Maybe not a solo kill. I think I just burned its Flash… I left a little, but I ate all the meat, hehe."],["그냥 흔한 길거리지만..\n꽃이 이뻐서..","Just an ordinary street… but the flowers were pretty."],["꽃구경 많이들 하셨나~~","Did you get to see plenty of flowers~~?"],["이건 좀 잘나왔다.. ㅋㅋㅋㅋ","This one came out pretty good, hahaha."],["안뇽","Hiii."],["옷이 좀 큰가.. 이제봤네","Is my shirt a bit big…? I only just noticed."],["요즘엔 크게 입는게 빠숑이지","Oversized is fashion these days."],["일요일 잘 쉬고있나? 난 경기 준비중 열심히 해야지","Are you having a restful Sunday? I'm getting ready for the match. Gotta work hard."],["라고 보내고 연습하고 왔는데 왜 안보내져있냐..","Or so I thought I'd sent before practice. How come it never went through…"],["인스타 사진 봤어? ㅎㅎ 바다 보고 봄맞이 하고왔당","Did you see my Instagram photos? I saw the sea and welcomed spring, haha."],["매니저님이 사격도 알려주심..","My manager taught me how to shoot too…"],["바다는 월미도 다녀왔는데 처음간것 같은데 너무 좋음.. 가까우면 다녀오는거 추천","I went to Wolmido for the sea. I think it was my first time, and I really liked it. I recommend going if you're nearby."],["날 더워서 미용해써용","She got groomed because it's getting hot."],["나도 모닝이 못본지 한 세월..","It's been ages since I saw Morning too…"],["오늘 방송 있다 ^_^","There's a stream today ^_^"],["화이팅화이팅","Let's go, let's go."],["-밥잘먹은사람-","—Someone who ate well—"],["배부루다","I'm so full."],["낼부터 홈그 시작이구먼 ㅎㅎ 여유 있는 사람들은 와서 재밌게 놀다 갔으면 좋겠다!!","Home Ground starts tomorrow, haha. If you have time, I hope you come and have fun!!"],["나도 시간되면 인천바다 보고와야징","If I get time, I'll go see the sea in Incheon too."],["바다 왜이렇게 좋아하냐고? 흠..","Why do I like the sea so much? Hmm…"],["마음이 편안해지는 느낌을 받아서?","Because it makes me feel at peace, maybe?"],["경기전에 키보드 키캡 하나가 사라져서 찾았는데 (다행히 불필요한 키)","One of my keycaps disappeared before the match, so I was looking for it. (Luckily it wasn't a key I needed.)"],["카메라에 잡혔군","The camera caught me."],["결국 못찾긴 했따","I never found it in the end, though."],["질문이 많길래 답하러 왔음 ㅎㅎ","I got a lot of questions, so I came to answer them, haha."],["월즈 스킨 근황을 좀 봤는데..","I checked the latest on the Worlds skin…"],["재밌다 재밌어","This is fun, this is fun."],["월즈스킨 얼마지??","How much is the Worlds skin??"],["후","Phew."],["안사고 못배길듯 ㅠ\n구매 강요 되는거같아서 미안하네 ㅜㅜ ㅋ\n^_^","Looks like I won't be able to resist buying it ㅠ Sorry if it sounds like I'm pushing you to buy it, haha ^_^"],["어린이(?)날","Children's (?) Day."],["어린이들 있나","Any kids here?"],["요즘 어린이들은 롤 안한대.. 롤하면 어른이야 이제","Kids these days apparently don't play League. If you play League, you're an adult now."],["음해 당하던 거지옷 요릭으로 증명했다..^^","Yorick proved the ragged outfit everyone was slandering had a point… ^^"],["그래도 거지옷은 거지옷이야","Still, rags are rags."],["네..? 여전히 미움받는 거릭 ㅜㅜ","Huh…? Poor Ragrick is still getting hate ㅜㅜ"],["그러고보니 엊그제 꿈꿨는데 내가 운전하고 있었거든? 근데 순간 운전하는법을 까먹어서 막 벽 다 긁고 난리났었는데","Come to think of it, I had a dream the other day where I was driving, suddenly forgot how, and scraped up all the walls. It was a mess."],["꿈은 반대구먼 하하하","I guess dreams mean the opposite, hahaha."],["대형버스 하나 대여해서 팬들이랑 전국일주하고싶네\n도란기사님으로","I want to rent a big bus and take the fans around the country, with Doran as your driver."],["아 나 2종보통이지","Oh, right. I only have a regular Class 2 license."],["응원에 보답한 경기같아서 좋은 밤이다 ㅎㅎ\n난 앞으로의 경기들을 위해서 컨디션관리 열심히 해볼게~~\n밥잘먹고 일찍자자 ☺️☺️","It's a nice night because it feels like we played a match that repaid your support, haha. I'll take good care of myself for the matches ahead~~ Eat well and get to bed early ☺️☺️"],["머리 짤랐슈","Got a haircut."],["많이는 안짤랐슈","Didn't take much off, though."],["짬뽕 한그릇 먹고 들어왔다 ㅎㅅㅎ","Just got back from having a bowl of jjamppong, hehe."],["저녁엔 방송도 있다!\n연습 잘하고 방송킬게 ^^","I'm streaming tonight too! I'll go live after practice ^^"],["저녁잘챙겨무","Make sure you have dinner."],["저녁 안먹은사람 방송출입금지","No one who skipped dinner is allowed in the stream."],["월요일 힘차게 보냈나 대원들","Did you get through Monday strong, troops?"],["나도 주말 잘 쉬고 다시 달리는중 ㅎㅎ 낼부터 방송 많더랑","I rested well over the weekend and I'm back at it, haha. I've got a lot of streams starting tomorrow."],["우연히 예전 영상을 봤는데\n나 왜이렇게 어리지 ㅋㅋㅋ\n게임밖에 모르고 열정 가득했던 그 시절의 도란\n내가 봐도 기특하다... 머리는 저게머냐\n암튼 잘컸다 ㅎㅎ {이름} 이 함께 해줘서라고 생각해 고마워 ^^\n영상 링크는 달고 갈게\n잘자고 내일보자!!","I stumbled across an old video. Why do I look so young, hahaha? Back then, Doran knew nothing but games and was full of passion. Even I'm proud of that kid… What is with that hair, though? Anyway, I grew up well, haha. I think that's because you were there with me, {이름}. Thank you ^^ I'll leave the link. Sleep well, see you tomorrow!!"],["낼 원주 오는사람~~?","Anyone coming to Wonju tomorrow~~?"],["음음 평일이라 바쁘긴하겠군!","Mm, you probably will be busy since it's a weekday!"],["난 먼저와서 이것저것 하고있다능","I got here early and I'm doing this and that."],["덕분에 잘 다녀왔어요 ^_^","It went well thanks to you ^_^"],["오늘 카페인에 중독돼서 몇시쯤 잠들수 있을지 미지수","I'm so hooked on caffeine today that I have no idea when I'll fall asleep."],["내일은 침대와 데이트가 있어서..\n찾지마슈","I've got a date with my bed tomorrow, so don't come looking for me."],["좀 푹 쉬고싶다 ㅠㅠ","I want to get some proper rest ㅠㅠ"],["도붕이들도 고생해따 치어풀도 많이 보이더라 ㅋㅋ\n고맙습니다감사합니다🤗","You worked hard too, Doran fans. I saw a lot of cheer signs, haha. Thank you, thank you 🤗"],["촬영 다녀왔다! 올해는 쉴 틈 없이 바쁠 것 같네 ㅎㅎ\n벌써 한 해의 절반이 지나고 있지만\n남은 절반을 위해 다시 한 번 마음을 굳게 먹어야겠다고 문득 생각이 드는 날이야\n그럼에도 너무 큰 그림자가 드리워지면 마음이 허해질 때가 있지만 그럴 때마다 헬스장에서 바를 들어주며 “하나만 더”를 외치는 PT 선생님처럼 나를 믿어주고 응원해주는 고마운 존재들 덕분에 오늘도 다시 마음을 굳게 다잡을 수 있는 것 같다!\n원래 속마음을 잘 비치지 않는 편이지만, 늘 받기만 하는 입장이다 보니 가끔은 내 속내도 조금은 드러내도 괜찮지 않을까 하는 생각이 들어서 ☺️","Just got back from a shoot! I think this year will keep me busy without a break, haha. Half the year's already gone, but today it suddenly hit me that I need to recommit for the half that's left. When a big shadow falls over me I sometimes feel empty, but you believe in me and cheer me on, like a trainer spotting my bar at the gym and yelling “one more!” You're the reason I can pull myself together again today. I don't usually show what I'm feeling, but since I'm always on the receiving end of your support, I thought maybe it's okay to open up a little sometimes ☺️"],["그럼 난 낼 또 일정이 있어서 먼저 잔다\n일찍자라 꼬마들아~~","I've got things on tomorrow, so I'm going to bed first. Get to bed early, you little ones~~"],["상나이 또이 안 포","I had pho this morning."],["남자는 혼밥이지 암암","Real men eat alone, yep yep."],["나도 열심히 산다 이말이야","What I'm saying is, I work hard too."],["물론 오늘은 쉬는날이라 좀전에 일어남","Of course, it's my day off, so I only just got up."],["전반적인 평이 나쁘지않군..\n노력한 보람이 있어 후후\n내일부터 다들 1일1베사 연습하자~\n스킨나오면 승률 쭉쭉 올려야지 우하하\n많관부 많응부 우하하하","The overall reaction's not bad… All that work paid off, hehe. Starting tomorrow, one Ambessa game a day for everyone~ We need to jack up that win rate when the skin comes out, mwahaha. Give it lots of attention and cheer for me, mwahaha."],["요즘 일찍자는거 연습중.. 경기시간이 점심일찍이라 ㅎㅎ\n{이름}도 일찍 잘거지?","I'm practicing going to bed early since the match is early in the afternoon, haha. You're going to sleep early too, right, {이름}?"],["그러고보니 어제 내준 숙제는 했니?","Come to think of it, did you do the homework I assigned yesterday?"],["아니요 선생님.. 직장인은 게임 평일에 못해요..","No, sir… People with jobs can't play games on weekdays…"],["그래요..? 그럼 주말에 몰아서 하렴~","Is that so…? Then do it all over the weekend~"],["ㅋㅋㅋㅋ 농담 ^_^","Hahaha, just kidding ^_^"],["스킨 질문이 많아서 하나 얘기하자면","I've gotten a lot of questions about the skin, so here's one thing."],["궁에 얼굴 나오는거 나도 어제 알았다...\n내가 검토한 영상에서는 얼굴 위에 챔피언이 서있어서 안보였어 ㅜㅜ\n그만큼 인게임에선 티 안날듯 ㅋㅋ","I only found out yesterday that my face shows up in the ult… In the clip I reviewed, the champion was standing over my face, so I couldn't see it ㅜㅜ That probably tells you how subtle it is in-game, haha."],["다른 부분들은 내가 요청한것보다 디자이너팀에서 디테일 잘 잡아주셔서 이쁘게 잘 나온거같구요","The designers nailed details beyond what I asked for, and I think the rest came out beautifully."],["잘다녀오겠습니다 ^^","I'll be back safely ^^"],["일어날 시간이다 닝겐들","Time to get up, humans."],["오 부지런한걸\n난 이제 잘시간이지만..","Oh, you're up and at it. It's bedtime for me though…"],["경기 시간대가 딱 한국에서 보기좋을 것 같네 ㅎㅎ 오늘도 좋은 하루 보내고 많이 웃자!!","Looks like the match time is just right for watching in Korea, haha. Have a great day and laugh a lot!!"],["자려고 누웠는데 갑자기 기분이 좋다!\n내 기운 빌려줄게 자고 일어나면 다시 가져간다 ^^","I got into bed and suddenly felt really happy! I'll lend you my good energy and take it back when I wake up ^^"],["저는 조용히 본가 내려왔습니다..\n이번 생일은 고향에서 가족들과 보낼예정 ㅎㅎ","I quietly came back home… I'm spending this birthday in my hometown with my family, haha."],["{이름}! 덕분에 행복한 생일 잘 보냈습니다 ☺️\n혼자였으면 평소와 똑같은 하루였겠지만\n많은 분들이 오늘이 생일이라는걸 망각하지않도록 계속 축하해줘서 참 고마웠다!\n내가 태어난 날을 나에게 이렇게 특별한 날로 만들어줘서 감사합니다\n☺️☺️","{이름}! I had a happy birthday thanks to you ☺️ If I'd been on my own, it would've been like any other day. I was so grateful that so many people kept wishing me happy birthday and wouldn't let me forget. Thank you for making the day I was born so special to me ☺️☺️"],["이번 생일에 팬분들이 뭐 많이 준비하셨던데!\n기부랑 생일카페랑 뭐 이것저것..\n눈으로 다 담지못해서 아쉬울뿐","Fans put together a lot for my birthday! Donations, birthday cafés, all kinds of things… I just wish I could have seen all of it myself."],["ㅋㅋㅋㅋ 귀국해서 바로 창원오느라 티카페만 슥 들렀다왔는데","Hahaha, I went straight to Changwon after landing, so I only managed a quick stop at T Café."],["남자팬들은 카페 잘 안오나..? 다 여자팬분들이셔서 먼가 웃김","Do male fans not really come to cafés…? Everyone there was a woman, which was kind of funny."],["바다보러 부산갔는데 바로앞에 베이스캠프 있는겨.. 입구까지만 보고 부끄러워서 도망 ㅋㅋㅋ","I went to Busan to see the sea and the Base Camp was right in front of me… I only made it to the entrance, then got embarrassed and ran off, haha."],["너무 얼굴이 대문짝만해 ㅋㅋ","My face is huge on there, haha."],["저번 에이블리 촬영때 한컷..\n새벽이니까 조용히 보내고 갑니다\n^^\n기분 조은날 푹 자고 내일도 화이팅\n🫰 ㅋ","A shot from that ABLY shoot a while ago… It's late, so I'll leave it here quietly ^^ Get a good sleep after a nice day, and you've got this tomorrow too 🫰 ha."],["쉬는날이면 왜이렇게 늦게 자고싶을까..","Why do I always want to stay up so late on my days off…"],["자기 아까워서 늦게 잤다가 좀전에 일어났음.. 내 쉬는날 삭제","Going to bed felt like a waste, so I stayed up late and only just woke up… Day off deleted."],["일요일 머했어용","What did you do on Sunday?"],["??","??"],["갑자기 기억난다 꿈꿨는데 돌아가신 할머니 나오셔서 많이 울었어 물론 꿈에서","I just remembered I dreamed about my late grandma and cried a lot. In the dream, of course."],["현실에선 갱상도는 안운다","In real life, people from Gyeongsang don't cry."],["담주 홈그 준비잘해보자궁","Let's get ready for next week's Home Ground."],["저녁먹고 산책! 다들 모하나","Taking a walk after dinner! What's everyone up to?"],["행주~~(행복한 주말)","Happy weekend~~"],["강쥐들은 태어난 날이 생일일까\n집에 데려온 날이 생일일까","Is a dog's birthday the day they're born or the day you bring them home?"],["태어난걸 직접 보진 못했으니 데려온날이 맞나?","I didn't see her being born, so maybe it should be the day I brought her home?"],["근데 모닝이는 챙겨줘도 모를테니\n주변 사람들을 더 챙겨보자..","Morning won't know even if I celebrate it, so maybe I should take better care of the people around me…"],["얘가 뭘 알겠오","What would she know?"],["하이디라오 얌얌","Haidilao, yum yum."],["잘먹어야 일도 잘한다\n다들 끼니 거르지말자잉 ^ㅇ^","You work better when you eat well. No skipping meals, everyone ^ㅇ^"],["이거 좀 잘나온듯.. 치명적","This one came out pretty good… devastatingly good."],["도신발언 : 김밥에 오이는 ..","Doran's controversial take: cucumber in gimbap is…"],["오이향김밥 먹느라 욕봤다잉","I suffered through cucumber-scented gimbap."],["오이는 이름도 참 독특하네\n오이오이","Cucumber has a funny name in Korean, too. Oi oi."],["오이향 먹고 힘내서 주말 경기 잘해보장","I'll get some strength from that cucumber aroma and play well this weekend."],["오이 욕한 댓가 제대로 받았습니다..","I paid dearly for talking smack about cucumber…"],["오이야 친하게 지내자","Cucumber, let's be friends."],["더 열심히해서 월즈땐 좋은 성과 내보겠습니다 화이팅 ^-^","I'll work harder and try to get a good result at Worlds. Let's go ^-^"],["본가 왔지~","I'm back at my family's place~"],["난 아무래도 태생이 지방사람이 맞는 것 같아","I think I'm a small-town guy at heart."],["창원 공기 죠타아","The air in Changwon is so nice."],["좀전에 겨울노래를 우연히 들었는데 어느새 겨울이 코앞인거야\n시간이야 항상 빨랐다지만 .. 올해는 뭔가 기억에 남는게 없더라고 ㅜㅜ\n뭔가 인생 손해본느낌","I happened to hear a winter song a bit ago and realized winter's already around the corner. Time always goes by fast, but I don't feel like much from this year really stayed with me ㅜㅜ It feels like I lost out on a little bit of life."],["남은 올해와 곧 맞이할 내년을 위해 열심히 살아야징","I'll give it my all for the rest of this year and for the new one coming up."],["위시런은 미리 미안하게됐다..","I already feel like I owe you an apology for the Wish Run…"],["자신이 없다..","I'm not confident…"],["내가언제 10분컷 한다했음??\n자꾸 주변에서 내가 10분컷 한다고 꺼드럭 거렸다는디","When did I ever say I'd finish in ten minutes?? People keep telling me I was bragging about doing it in ten minutes."],["나 진짜 기억이 안나","I honestly don't remember."],["아 퇴근길때","Oh, on the way out of work."],["멍치원 퇴근시간이라 난 이만..","It's time to pick her up from doggy daycare, so I'm off…"],["6킬로 뛰었더니 힘드네..","I ran six kilometers. I'm worn out…"],["완주하고 1킬로 더 가서 기다렸다잉","I finished, went another kilometer, and waited there."],["즐추즐추 ~~\n게임한다고 창원 못갔냐고 묻는사람들이 많은데 애진작 창원입니다...\n이번에 집에서도 솔랭할만한 환경이 만들어져서 ㅋㅋ 천천히 감 잡는중 ㅎㅎ\n소중한 사람들과 행복한 시간 보내길..!☺️","Happy Chuseok~~ A lot of you are asking whether I missed going to Changwon because I was gaming, but I've been here for ages… I finally have a setup for solo queue at home, so I'm slowly getting back into it, haha. Have a lovely time with the people you care about! ☺️"],["리얼리티한 일상중의 모닝이","A very real glimpse of Morning's everyday life."],["울집 몇주전에 이사했는데 완전좋음 ㅎㅎ\n언제 한번 보여주고싶다~~","We moved a few weeks ago and I love it, haha. I want to show you sometime~~"],["긴 연휴 끝나고 다시 월요일이 왔네 ㅎㅎ\n일상으로 돌아가는 기분이 어때","The long holiday's over and Monday's back, haha. How does it feel getting back to your routine?"],["난 휴가인데 밤낮이 바껴서 요즘은 이시간에 잠..","I'm on vacation, but my sleep schedule is flipped, so this is when I go to sleep lately…"],["심란하다..","I'm so unsettled…"],["몹시","Very."],["분명 오늘 11시 방송이었는데 어떻게 된거지","I could've sworn the stream was at 11 today. What happened?"],["부랴부랴 서울 올라왔는데 흠","I rushed all the way up to Seoul, hmm."],["그만큼 방송하고 싶으셨던거지","You just wanted to stream that badly."],["내일방송을 착각했지 뭐야","Turns out I mixed it up with tomorrow's stream."],["하하하","Hahaha."],["오늘 좀 쉬고 내일 6시간 방송 갈게요 ^_0","I'll rest today and stream for six hours tomorrow ^_0"],["여행가고싶은데 멀리가긴싫을때 →\n제주도","When you want a trip without going too far → Jeju."],["흑돼지 짱맛집 찾았음","I found a fantastic black pork place."],["나중에 정리해서 알려줌..","I'll put together some recommendations later…"],["원래 으잉 큰일 앞두고 으잉","See, when you've got something big coming up, see…"],["바다를 봐야하는겨 아라쒀?","You've gotta look at the sea, got it?"],["잘 쉬고 맛집이나 조은곳 있으면 알려줄게 ㅎㅎ","I'll get some rest and let you know if I find good places to eat or visit, haha."],["제주도란","Jeju Doran."],["아아 들리나","Testing, testing. Can you hear me?"],["닉네임 바꿔봄 후후","Changed my nickname, hehe."],["어 뭐야","Oh, what?"],["원래 닉 뺏겼는데? 누구냐","Someone took my old nickname? Who was it?"],["닉네임이 Doran인게 밋밋해서 변화를 줘봤지","Just having Doran as my nickname felt a bit plain, so I switched it up."],["프사도 배경이 이상하다고?","The background of my profile photo looks weird too?"],["너무 인스타야","It's way too Instagram."],["그런가","Is it?"],["하 사이즈 안맞는거 불편해","Ugh, it bothers me that the sizing doesn't fit."],["봐줘","Cut me some slack."],["이제 너무 아저씨 것 같아. 저희 아빠 스타일이야","Now it looks too much like an older guy's. It's my dad's style."],["난 그 분위기가 좋더라","I like that vibe, though."],["나 왜 방송하다 운 사람 돼있냐..","How did I become the guy who cried on stream…"],["휴 피곤하구만","Phew, I'm tired."],["출국전에 삼겹살 든든하게 먹구옴 ㅎㅎ 저녁 먹었니~~","I had a hearty pork belly meal before flying out, haha. Have you had dinner~~?"],["연습 시작하는데 식곤증 오는중","Practice is starting and the food coma is kicking in."],["정신 차려서 다녀올게!! 화이팅~~","I'll pull myself together and get going!! Let's go~~"],["저녁 좋은시간 보내자 ^_^","Let's have a nice evening ^_^"],["근황.. 미국와서 적응하고 경기 준비하느라 자주 못와서 미안 ㅎㅎ ㅠ\n내일 오랜만에 경기인데 많응부~~\n여긴 잘시간이라 이제 잔다!\n내일보자😁😁","A little update… Sorry I haven't been around much, haha. I've been getting settled in the US and preparing for matches. It's been a while since my last match, so cheer for me tomorrow~~ It's bedtime here, so I'm off to sleep! See you tomorrow 😁😁"],["히야... 취한다~~","Ahhh… I'm getting drunk on the cuteness~~"]]);
const translationButton=$('#toggleEnglish');
let englishEnabled=readLocal('pop-english-v1',false)===true;
function appendEnglish(node,source){
 const text=englishText.get(source);
 if(!text||text===source||!node)return;
 const english=el('span','english-translation',personalize(text));
 english.lang='en';
 node.append(english);
}
function updateEnglish(){
 document.body.classList.toggle('show-english',englishEnabled);
 translationButton.setAttribute('aria-pressed',String(englishEnabled));
 translationButton.textContent=englishEnabled?'영어 번역 끄기':'영어 번역 켜기';
}
translationButton.onclick=()=>{
 const location=currentReadingPosition();
 englishEnabled=!englishEnabled;
 writeLocal('pop-english-v1',englishEnabled);
 updateEnglish();
 if(location)restoreReadingPosition(location);
 $('#translation').close();
};
updateEnglish();

function writeLocal(key,value){
 try{localStorage.setItem(key,JSON.stringify(value))}catch{}
}
const storedHearts=readLocal('pop-hearts-v1',[]);
const hearts=new Set(Array.isArray(storedHearts)?storedHearts:[]);
const storedReplies=readLocal('pop-anniversary-replies-v1',{});
const anniversaryReplies=storedReplies&&typeof storedReplies==='object'&&!Array.isArray(storedReplies)?storedReplies:{};
const heartEntries=new Map();
const heartKeys=groups.map(([date,rows],dayIndex)=>{
 const occurrences=new Map();
 return rows.map(([time,parts],rowIndex)=>{
  const occurrence=occurrences.get(time)||0;
  occurrences.set(time,occurrence+1);
  return parts.map((part,partIndex)=>{
   const key=JSON.stringify([parseDate(date),time,occurrence,partIndex]);
   heartEntries.set(key,{date,time,part,partIndex,dayIndex,rowIndex});
   return key;
  });
 });
});
function setHeartAppearance(button,key){
 const saved=hearts.has(key);
 button.textContent=saved?'♥':'♡';
 button.setAttribute('aria-pressed',String(saved));
 button.setAttribute('aria-label',saved?'하트 취소':'하트 저장');
}
function heartButton(key){
 const button=el('button','heart-toggle');
 button.type='button';
 button.dataset.heart=key;
 setHeartAppearance(button,key);
 button.onclick=()=>{
  if(hearts.has(key))hearts.delete(key);
  else hearts.add(key);
  writeLocal('pop-hearts-v1',[...hearts]);
  for(const item of document.querySelectorAll('.heart-toggle')){
   if(item.dataset.heart===key)setHeartAppearance(item,key);
  }
  if($('#heartDialog').open)renderHeartList();
 };
 return button;
}
function makeHeart(dayIndex,rowIndex,partIndex){
 return heartButton(heartKeys[dayIndex][rowIndex][partIndex]);
}
function renderHeartList(){
 const list=$('#heartList');
 list.replaceChildren();
 const entries=[...hearts].reverse().filter(key=>heartEntries.has(key));
 if(!entries.length){
  list.append(el('p','','하트를 누른 팝이 여기에 모여요.'));
  return;
 }
 for(const key of entries){
  const {date,time,part,dayIndex,rowIndex,partIndex}=heartEntries.get(key);
  const [kind,value,detail]=part;
  const row=el('div','heart-row');
  const button=el('button','search-result');
  const text=kind==='text'?personalize(value):kind==='reply'?personalize(detail):detail;
  button.append(el('small','',date+' · '+formatTime(time)),el('span','heart-preview',text));
  if(kind==='photo'||kind==='sticker'){
   const thumbnail=el('img','heart-thumbnail');
   thumbnail.src=assets[value];
   thumbnail.alt='';
   thumbnail.loading='lazy';
   button.append(thumbnail);
  }
  button.onclick=()=>{
   enterChat(false);
   goToMessage(dayIndex,rowIndex,'',$('#heartDialog'),partIndex);
  };
  row.append(button,heartButton(key));
  list.append(row);
 }
}
function openHearts(){
 renderHeartList();
 $('#heartDialog').showModal();
}
function koreanDate(){
 return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
}
function anniversaryDays(today){
 const [year]=today.split('-');
 return groups.flatMap(([date],index)=>{
  const iso=parseDate(date);
  return iso&&iso.slice(0,4)<year&&iso.slice(5)===today.slice(5)
   ?[{index,iso,age:Number(year)-Number(iso.slice(0,4))}]:[];
 }).reverse();
}
let anniversarySelection;
let homeDate='';
function showAnniversary(day){
 anniversarySelection=day;
 const title=$('#anniversaryTitle');
 title.textContent=day.age+'년 전 오늘의 도란';
 const body=$('#anniversaryMessages');
 const [date,rows]=groups[day.index];
 const separator=el('div','date');
 separator.append(el('span','',date));
 body.replaceChildren(separator,...rows.map((_,i)=>makeMessageGroup(day.index,i)));
 for(const tab of $('#anniversaryYears').children){
  tab.setAttribute('aria-pressed',String(tab.dataset.iso===day.iso));
 }
 $('#anniversaryReply').value='';
 renderAnniversaryReplies();
}
function renderAnniversaryReplies(){
 const key=anniversarySelection.iso;
 const replies=Array.isArray(anniversaryReplies[key])?anniversaryReplies[key]:[];
 $('#anniversaryReplies').replaceChildren(...replies.map(text=>el('div','bubble local-reply',text)));
}
function refreshAnniversary(){
 homeDate=koreanDate();
 const available=anniversaryDays(homeDate);
 $('#onThisDay').hidden=!name||!available.length;
 anniversarySelection=undefined;
 if($('#onThisDay').hidden)return;
 const tabs=$('#anniversaryYears');
 tabs.replaceChildren();
 tabs.hidden=available.length<2;
 for(const day of available){
  const button=el('button','',day.age+'년 전');
  button.type='button';
  button.dataset.iso=day.iso;
  button.onclick=()=>showAnniversary(day);
  tabs.append(button);
 }
 showAnniversary(available[0]);
}
function saveNickname(value){
 name=value;
 try{localStorage.setItem('pop-name',name)}catch{}
}
const readingKey='pop-reading-position-v1';
let readingFrame=0;
function currentReadingPosition(){
 if($('#phone').hidden)return null;
 const chat=$('#chat');
 const top=chat.getBoundingClientRect().top;
 const parts=chat.querySelectorAll('[data-reading-key]');
 let lo=0,hi=parts.length;
 while(lo<hi){
  const mid=(lo+hi)>>1;
  if(parts[mid].getBoundingClientRect().bottom<=top)lo=mid+1;
  else hi=mid;
 }
 const part=parts[lo];
 return part?{key:part.dataset.readingKey,offset:part.getBoundingClientRect().top-top}:null;
}
function rememberReadingPosition(){
 const position=currentReadingPosition();
 if(position)writeLocal(readingKey,position);
}
function restoreReadingPosition(position){
 const entry=heartEntries.get(position.key);
 if(!entry)return false;
 const row=$('#message-'+entry.dayIndex+'-'+entry.rowIndex);
 const part=row?.querySelectorAll('.message-part')[entry.partIndex];
 if(!part)return false;
 const chat=$('#chat');
 chat.scrollTop+=part.getBoundingClientRect().top-chat.getBoundingClientRect().top-
  (Number.isFinite(position.offset)?position.offset:0);
 return true;
}
function showHome(){
 rememberReadingPosition();
 const saved=readLocal(readingKey,null);
 $('#resumeReading').hidden=!heartEntries.has(saved?.key);
 $('#phone').hidden=true;
 $('#home').hidden=false;
 $('#name').value=name;
 refreshAnniversary();
}
let renderedName;
function enterChat(latest=true){
 $('#home').hidden=true;
 $('#phone').hidden=false;
 if(renderedName!==name){
  render();
  renderedName=name;
 }
 if(latest)requestAnimationFrame(()=>{scrollToLatest();rememberReadingPosition()});
}
function initHome(){
 showHome();
 $('#goHome').onclick=showHome;
 $('#nameForm').onsubmit=event=>{
  event.preventDefault();
  const nickname=$('#name').value.trim();
  if(!nickname)return;
  saveNickname(nickname);
  enterChat();
 };
 $('#name').addEventListener('change',()=>{
  const nickname=$('#name').value.trim();
  if(nickname===name||!nickname)return;
  saveNickname(nickname);
  refreshAnniversary();
 });
 $('#resumeReading').onclick=()=>{
  const nickname=$('#name').value.trim();
  if(!nickname){$('#name').reportValidity();return}
  const saved=readLocal(readingKey,null);
  if(!heartEntries.has(saved?.key))return;
  saveNickname(nickname);
  enterChat(false);
  restoreReadingPosition(saved);
 };
 $('#chat').addEventListener('scroll',()=>{
  if(readingFrame)return;
  readingFrame=requestAnimationFrame(()=>{
   readingFrame=0;
   rememberReadingPosition();
  });
 },{passive:true});
 window.addEventListener('pagehide',rememberReadingPosition);
 $('#homeHearts').onclick=openHearts;
 $('#openHearts').onclick=()=>{
  $('#settings').close();
  openHearts();
 };
 $('#anniversaryForm').onsubmit=event=>{
  event.preventDefault();
  if(koreanDate()!==homeDate){refreshAnniversary();return}
  if(!anniversarySelection)return;
  const text=$('#anniversaryReply').value.trim();
  if(!text)return;
  const key=anniversarySelection.iso;
  const previous=Array.isArray(anniversaryReplies[key])?anniversaryReplies[key]:[];
  anniversaryReplies[key]=[...previous,text];
  writeLocal('pop-anniversary-replies-v1',anniversaryReplies);
  renderAnniversaryReplies();
  $('#anniversaryReply').value='';
 };
 document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&!$('#home').hidden&&koreanDate()!==homeDate)refreshAnniversary();
 });
 window.setInterval(()=>{
  if(!$('#home').hidden&&koreanDate()!==homeDate)refreshAnniversary();
 },60000);
}

if('scrollRestoration' in history)history.scrollRestoration='manual';
initHome();
updateProfilePhotos();
</script></body></html>
